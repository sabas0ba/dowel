[package]
name = "dowel-up"
# semver の慣行どおり初期開発の版は 0.1.0 から始める。ワークスペースの
# 0.0.1 は既存クレート群の値であり、本クレートは独立に版を進める。
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Fetches, pins, and switches versions of the dowel binary."

[[bin]]
name = "dowelup"
path = "src/main.rs"
