[package]
name = "dowel-up"
# semver の慣行どおり初期開発の版は 0.1.0 から始める。ワークスペースの
# 0.0.1 は既存クレート群の値であり、本クレートは独立に版を進める。
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Fetches, pins, and switches versions of the dowel binary."

[dependencies]
# SHA-256 のためだけに引く（ADR-0036）。ハッシュを2箇所に持つと、
# 2つが食い違いうる。dowel-support は std だけに依る小さなクレートである。
dowel-support.workspace = true

[[bin]]
name = "dowelup"
path = "src/main.rs"
