# サイドバーの並び。docs/README.md の区分と同じ順に並べる。
#
# 索引（docs/README.md）は文書間のリンクで、こちらは頁の枠。二重に持つのは
# 冗長だが、Liquid で見出しから並び順を導くと文書側の書式に縛りが増える。
# 代わりに、この一覧が指す先の存在は crates/dowel-cli/tests/docs.rs が見る。
#
# `path` はサイトの根からの住所（`.md` ではなく `.html`）。`baseurl` は雛形側で
# 足すため、ここには書かない。`docs/adr/` のように README がその索引になる
# ディレクトリは末尾を `/` にする（`docs/` だけは事情が異なる。_config.yml の
# `include` の項を参照）。

