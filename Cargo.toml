[workspace]
resolver = "2"
members = [
    "crates/dowel-support",
    "crates/dowel-syntax",
    "crates/dowel-query",
    "crates/dowel-store",
    "crates/dowel-eval",
    "crates/dowel-model",
    "crates/dowel-build",
    "crates/dowel-lsp",
    "crates/dowel-cli",
    "crates/dowel-up",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.89"  # std::fs::File::try_lock（ADR-0002 の単一書き手制限）
license = "Apache-2.0"
repository = "https://github.com/sabas0ba/dowel"

[workspace.dependencies]
dowel-support = { path = "crates/dowel-support" }
dowel-syntax = { path = "crates/dowel-syntax" }
dowel-query = { path = "crates/dowel-query" }
dowel-store = { path = "crates/dowel-store" }
dowel-eval = { path = "crates/dowel-eval" }
dowel-model = { path = "crates/dowel-model" }
dowel-build = { path = "crates/dowel-build" }
dowel-lsp = { path = "crates/dowel-lsp" }

# 起動時間の予算（無操作時 10ms 以下、docs/20-architecture.md 5.4）は
# リリースビルドの構成に依存する。動的リンクを増やさないため LTO を有効にする。
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
