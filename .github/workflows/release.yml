# リリース資産の公開（[ADR-0036](../../docs/adr/0036-prebuilt-distribution.md)）。
#
# 資産の名前と置き場所は dowelup が探す形と1対1である:
#
#   <upstream>/releases/download/<tag>/dowel-<tag>-<triple>.tar.gz
#   <upstream>/releases/download/<tag>/dowel-<tag>-<triple>.tar.gz.sha256
#
# 命名が食い違えば dowelup は資産を見つけられず、黙ってソースからのビルドへ
# 落ちる——気付きにくい壊れ方なので、同じ配置を e2e が構成して確かめている
# （crates/dowel-up/tests/dowelup.rs の publish_asset）。
#
# ここが作るのはバイト列とその一覧である。それが「どの commit から作られたか」
# は資産の側からは確かめられない（ADR-0036）。示せるのはソースからのビルドの
# 側であり、`dowelup install --from-source` がその経路である。
#
# 外部アクションはコミットへ固定する（docs/50-development.md 5節）。

name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build assets for
        required: true

permissions:
  contents: write

jobs:
  assets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - runner: macos-latest
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build
        # `--locked` で固定どおりに組む。ロックを無視して組んだものを
        # 配ると、その版の宣言と配ったものが食い違う。
        run: cargo build --release --locked

      - name: Package
        id: package
        shell: bash
        run: |
          set -eu
          tag="${{ inputs.tag || github.ref_name }}"
          name="dowel-${tag}-${{ matrix.triple }}.tar.gz"
          mkdir -p stage
          cp target/release/dowel stage/
          tar -czf "$name" -C stage dowel
          # sha256sum は Linux、shasum は macOS。dowelup が読むのは
          # 先頭の 64 桁なので、どちらの書式でもよい。
          if command -v sha256sum >/dev/null; then
            sha256sum "$name" > "$name.sha256"
          else
            shasum -a 256 "$name" > "$name.sha256"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          cat "$name.sha256"

      - name: Publish
        uses: softprops/action-gh-release@f2ed4fca66d3d2eb1b2bfaa5b95ff5e51d1a4b95 # v2.4.1
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256
